# Copier template configuration for uv-based Python projects

# Minimum copier version required
_min_copier_version: "9.0.0"

# Questions asked during template generation
template_type:
  type: str
  help: What type of project do you want to create?
  choices:
    - oneoff
    - analysis
    - library
    - task
    - tabula-rasa
  default: oneoff

project_name:
  type: str
  help: What is your project name?
  default: "{{ _copier_conf.dst_path | basename }}"
  validator: "{% if not project_name %}Required{% endif %}"

project_slug:
  type: str
  help: Python package name
  default: "{{ project_name.lower().replace(' ', '_').replace('-', '_') }}"

project_description:
  type: str
  help: A short description of the project
  default: "A short description of the project."

user_name:
  type: str
  help: Your name
  default: ""

user_email:
  type: str
  help: Your email
  default: ""

github_user:
  type: str
  help: GitHub username
  default: ""
  when: "{{ template_type not in ['oneoff', 'tabula-rasa'] }}"

initial_version:
  type: str
  help: Initial version number (format x.y.z)
  default: "0.0.1"
  when: "{{ template_type not in ['oneoff', 'tabula-rasa'] }}"
  validator: "{% if not initial_version | regex_search('^\\d+\\.\\d+\\.\\d+$') %}Version must be in x.y.z format (e.g., 0.0.1){% endif %}"

python_version:
  type: str
  help: Python version to use
  default: "3.13"
  validator: "{% if not python_version | regex_search('^3\\.(1[2-9]|[2-9][0-9])(\\.[0-9]+)?$') %}Python version must be 3.12 or newer (e.g., 3.13){% endif %}"

use_vim_jupyter:
  type: bool
  help: Include vim keybindings in Jupyter Lab?
  default: true

# Subdirectory for template
_subdirectory: template

# Files/directories to exclude from the template
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - "PLAN.md"

# Jinja extensions to enable
_jinja_extensions:
  - jinja2_time.TimeExtension

# Tasks to run after generation
_tasks:
  # All tasks only run on copier copy/recopy, not update.
  # _copier_operation is "update" for all phases of copier update, including the
  # old-copy temp-dir phase, where uv sync is wasted work (and fails if that old
  # template version had a broken lock) and git add hits a nested-submodule failure.
  # After an update, run `uv sync` yourself.
  - command: "uv sync"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "cd scratch && uv sync"
    when: "{{ _copier_operation == 'copy' and template_type == 'library' }}"
  - command: "git init"
    when: "{{ _copier_operation == 'copy' and template_type not in ['oneoff'] }}"
  - command: "uvx pre-commit install"
    when: "{{ _copier_operation == 'copy' and template_type not in ['oneoff'] }}"
  - command: "chmod +x .bmv-post-commit.sh"
    when: "{{ _copier_operation == 'copy' and template_type == 'library' }}"

# Message to display after generation
_message_after_copy: |
  Your {{ template_type }} project "{{ project_name }}" has been created successfully!

  {% if template_type == 'oneoff' %}
  Next steps:
  1. cd {{ _copier_conf.dst_path }}
  2. Start coding in notebook.ipynb or create new Python files
  3. Use `poe lab` to launch Jupyter Lab or run notebooks in vscode
  {% elif template_type == 'analysis' %}
  Next steps:
  1. cd {{ _copier_conf.dst_path }}
  2. Add your dependencies to pyproject.toml via `uv add`
  3. Use `poe lab` to launch Jupyter Lab or run notebooks in vscode
  4. Put any analysis library code in src/{{ project_slug }}/
  {% elif template_type == 'library' %}
  Next steps:
  1. cd {{ _copier_conf.dst_path }}
  2. Add your dependencies to pyproject.toml via `uv add`
  3. Implement your library in src/{{ project_slug }}/
  4. Write tests in tests/
  5. Update documentation in docs/
  6. Use `poe test` to run tests
  7. Use `poe doc-preview` to preview docs
  8. Use `poe bump patch` to version
  9. Set up PyPI trusted publishing (see Release Process in CLAUDE.md)
  10. Release via `gh release create vX.Y.Z --generate-notes`
  {% elif template_type == 'task' %}
  Next steps:
  1. cd {{ _copier_conf.dst_path }}
  2. Implement your task in src/{{ project_slug }}/task.py
  3. Follow steps in HOW_TO_USE_TASKS.md for local or cloud task management
  {% elif template_type == 'tabula-rasa' %}
  Next steps:
  1. cd {{ _copier_conf.dst_path }}
  2. Add your dependencies to pyproject.toml via `uv add`
  3. Use `poe lab` to launch Jupyter Lab or run notebooks in vscode
  4. Put any code in src/{{ project_slug }}/
  {% endif %}

# Message to display after update
_message_after_update: |
  Your {{ template_type }} project has been updated!

  Next steps:
  1. Review the changes with `git diff` and resolve any conflicts (*.rej files or inline markers)
  2. Run `uv sync` to update dependencies and uv.lock{% if template_type == 'library' %} (and `cd scratch && uv sync`){% endif %}
  3. If you changed template type, expect new files and directories and a reworked pyproject.toml
