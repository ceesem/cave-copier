name: Test build all templates

on:
  push:
    branches:
      - main
  workflow_dispatch:
    
jobs:
  build:
    name: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # release tags are needed for the update test
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install copier
        run: uv tool install copier --with jinja2-time
      - name: Run template test
        run: bash ./test-templates.sh
